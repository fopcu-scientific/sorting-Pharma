<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مراسم اختيار القسم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&family=Cinzel:wght@500;700&display=swap">
<style>
/* Layout: full-screen night-sky canvas (stars + floating candles + gold dust) behind one centered column; questions on parchment, result as a wax-sealed decree with a hanging pennant */
:root{
  --night:#0b0a1a;
  --night-2:#1a1533;
  --gold:#e8c46a;
  --gold-deep:#a8802f;
  --parch:#f1e2bf;
  --parch-edge:#c9a970;
  --ink:#3a2412;
  --ink-soft:#6b4a2a;
  --pharma:#b3242c;
  --phyto:#2e7d4a;
  --ceutics:#c4861a;
  --medic:#5b3fa8;
  --f-magic:"Aref Ruqaa","Amiri",serif;
  --f-body:"Amiri","Times New Roman",serif;
  --f-latin:"Cinzel","Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#2a2150 0%,var(--night-2) 35%,var(--night) 75%);background-color:var(--night);color:var(--parch);font-family:var(--f-body);font-size:18px;line-height:1.75;padding-inline:16px;padding-block:20px 40px;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:580px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}

header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.org{font-family:var(--f-latin);font-size:11px;letter-spacing:.22em;color:var(--gold);opacity:.85;direction:ltr}
.org-ar{font-size:14px;color:var(--gold);opacity:.9}
.sound{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);display:grid;place-items:center;font-size:16px;color:var(--gold)}
.sound:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* candle progress */
.candles{display:flex;justify-content:space-between;align-items:flex-end;padding-inline:6px;height:46px}
.cd{position:relative;width:12px;height:26px;border-radius:3px 3px 2px 2px;background:linear-gradient(90deg,#d9cfb8,#fbf6ea 45%,#cbbf9f);opacity:.45;transition:opacity .4s}
.cd::before{content:"";position:absolute;left:50%;bottom:100%;width:2px;height:5px;background:#3b2a1a;transform:translateX(-50%)}
.cd .fl{position:absolute;left:50%;bottom:calc(100% + 3px);width:10px;height:16px;transform:translateX(-50%) scale(0);transform-origin:50% 100%;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 70%,#fff8d6 0%,#ffd36b 40%,#ff8a1f 75%,transparent 80%);filter:drop-shadow(0 0 8px #ffb347);transition:transform .45s cubic-bezier(.3,1.8,.5,1)}
.cd.lit{opacity:1}
.cd.lit .fl{transform:translateX(-50%) scale(1);animation:flick 1.6s ease-in-out infinite}
.cd.now{opacity:.9}
@keyframes flick{0%,100%{transform:translateX(-50%) scale(1) rotate(-2deg)}50%{transform:translateX(-50%) scale(1.08,.94) rotate(2deg)}}

/* parchment */
.parch{position:relative;background:
   radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.35),transparent 55%),
   radial-gradient(ellipse at 90% 95%,rgba(120,80,30,.22),transparent 60%),
   var(--parch);
  color:var(--ink);border-radius:6px;padding:30px 22px 26px;
  box-shadow:0 0 0 1px var(--parch-edge),inset 0 0 40px rgba(120,80,30,.35),0 20px 60px rgba(0,0,0,.55),0 0 80px rgba(232,196,106,.12);
  display:flex;flex-direction:column;gap:18px}
.parch::before,.parch::after{content:"";position:absolute;inset-inline:-8px;height:14px;border-radius:8px;background:linear-gradient(180deg,#8a6a3a,#d8b77a 45%,#6d4f26)}
.parch::before{top:-7px}.parch::after{bottom:-7px}
.flour{font-family:var(--f-latin);font-size:11px;letter-spacing:.3em;color:var(--ink-soft);text-align:center;direction:ltr}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--ink-soft),transparent);opacity:.5;position:relative}
.rule::after{content:"✦";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);font-size:12px;color:var(--ink-soft);background:var(--parch);padding:0 8px}

h1,h2{margin:0;text-wrap:balance;font-family:var(--f-magic);font-weight:700;line-height:1.35}
h1{font-size:clamp(34px,9vw,48px)}
h2{font-size:clamp(23px,5.8vw,28px);color:var(--ink)}
p{margin:0}

/* hero */
.hero{text-align:center;display:flex;flex-direction:column;gap:12px;padding-block:18px 6px}
.hero h1{color:var(--gold);background:linear-gradient(180deg,#fff2c4 10%,var(--gold) 50%,var(--gold-deep) 95%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 14px rgba(232,196,106,.35));animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 2px 26px rgba(232,196,106,.6))}}
.hero .sub{color:#d8cfae;font-size:18px;max-width:34ch;margin-inline:auto}

.pennants{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pen{display:flex;flex-direction:column;align-items:center;gap:6px;animation:sway 5s ease-in-out infinite;transform-origin:50% 0}
.pen:nth-child(2){animation-delay:-1.2s}.pen:nth-child(3){animation-delay:-2.4s}.pen:nth-child(4){animation-delay:-3.6s}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.pen .rod{width:100%;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--gold-deep),#fff0b8,var(--gold-deep))}
.pen .flag{width:84%;aspect-ratio:3/4.4;max-width:100%;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 100%,#fff 12%),color-mix(in srgb,var(--c) 70%,#000));clip-path:polygon(0 0,100% 0,100% 82%,50% 100%,0 82%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding-bottom:14%;box-shadow:inset 0 0 0 2px rgba(232,196,106,.5)}
.pen .flag .an{font-size:clamp(26px,7vw,36px);filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.pen .flag .nm{font-family:var(--f-latin);font-size:clamp(8px,2.2vw,10px);letter-spacing:.08em;color:#fff5d6;text-align:center;line-height:1.2;padding-inline:3px}

.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:14px 30px;border-radius:999px;font-family:var(--f-magic);font-size:22px;text-align:center;color:#2a1a06;background:linear-gradient(180deg,#fff0b8,var(--gold) 45%,var(--gold-deep));box-shadow:0 0 0 1px #fff3c7 inset,0 6px 22px rgba(232,196,106,.35);transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 0 1px #fff3c7 inset,0 8px 34px rgba(232,196,106,.6)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:4px}
.btn.ghost{background:transparent;color:var(--gold);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 55%,transparent) inset;font-size:19px}
.btn.ink{background:transparent;color:var(--ink-soft);box-shadow:0 0 0 1px var(--parch-edge) inset;font-size:18px;padding:10px 20px}
.btn[disabled]{opacity:.35;cursor:default}
.center{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qn{font-family:var(--f-latin);font-size:13px;color:var(--ink-soft);letter-spacing:.15em;direction:ltr}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:6px;border:1px solid color-mix(in srgb,var(--ink-soft) 35%,transparent);background:rgba(255,250,235,.45);color:var(--ink);font:inherit;font-size:18px;line-height:1.6;transition:background .2s,border-color .2s,transform .12s}
.opt:hover{background:rgba(255,250,235,.85);border-color:var(--ink-soft)}
.opt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.opt.picked{background:#fff8e6;border-color:var(--gold-deep);box-shadow:0 0 0 2px var(--gold) inset,0 0 20px rgba(232,196,106,.6);transform:scale(1.01)}
.key{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-magic);font-size:17px;color:var(--parch);background:radial-gradient(circle at 35% 30%,#8a2a24,#5a1410);box-shadow:inset 0 -2px 3px rgba(0,0,0,.35)}
.opt [lang="en"]{direction:ltr;unicode-bidi:isolate;font-family:var(--f-latin);font-size:16px;font-style:normal}

/* suspense */
.orb-wrap{display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:40px;text-align:center}
.orb{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(200,190,255,.35) 18%,rgba(90,70,190,.35) 55%,rgba(20,10,60,.9) 100%);box-shadow:0 0 60px rgba(160,140,255,.55),inset 0 0 40px rgba(255,255,255,.2);position:relative;overflow:hidden;animation:pulse 1.2s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent,rgba(232,196,106,.55),transparent 30%,rgba(180,160,255,.5),transparent 60%);animation:spin 1.4s linear infinite;mix-blend-mode:screen}
@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 100px rgba(200,180,255,.8),inset 0 0 40px rgba(255,255,255,.3)}}
@keyframes spin{to{transform:rotate(360deg)}}
.orb-text{font-family:var(--f-magic);font-size:26px;color:var(--gold);min-height:1.6em}

/* result */
.decree{text-align:center;align-items:center}
.seal{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;font-size:52px;margin-top:-6px;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 45%,color-mix(in srgb,var(--c) 60%,#000));box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 55%,#000) inset,0 6px 14px rgba(0,0,0,.35),0 0 50px color-mix(in srgb,var(--c) 60%,transparent);animation:seal .9s cubic-bezier(.2,1.6,.35,1) both .1s;position:relative}
.seal::before{content:"";position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 10deg,var(--c),color-mix(in srgb,var(--c) 60%,#000),var(--c),color-mix(in srgb,var(--c) 70%,#000),var(--c));z-index:-1;filter:blur(.5px);clip-path:polygon(50% 0,61% 6%,75% 3%,82% 15%,95% 20%,94% 34%,100% 46%,94% 58%,97% 72%,85% 80%,80% 94%,66% 93%,54% 100%,42% 94%,28% 97%,21% 85%,7% 80%,8% 66%,0 54%,6% 42%,3% 28%,15% 20%,20% 6%,34% 7%)}
@keyframes seal{from{transform:scale(2.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.decree .lede{font-family:var(--f-magic);font-size:22px;color:var(--ink-soft)}
.decree h1{font-family:var(--f-latin);font-size:clamp(30px,8.5vw,44px);color:var(--c);letter-spacing:.04em;direction:ltr;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.traits{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:0;margin:0;list-style:none}
.traits li{padding:3px 14px;border-radius:999px;border:1px solid var(--c);color:var(--c);font-weight:700;font-size:17px;background:rgba(255,250,235,.6)}
.blurb{font-size:19px;max-width:40ch}
.study{border-top:1px dashed var(--ink-soft);padding-top:14px;width:100%;text-align:right}
.study b{font-family:var(--f-magic);font-size:20px;display:block;color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:9px;width:100%}
.bar{display:grid;grid-template-columns:auto 1fr 3.2em;gap:10px;align-items:center;font-size:16px}
.bar .lab{font-family:var(--f-latin);font-size:12px;direction:ltr;min-width:8.5em;text-align:right}
.track{height:9px;border-radius:99px;background:rgba(107,74,42,.18);overflow:hidden}
.fill{height:100%;border-radius:99px;width:0;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.pct{font-family:var(--f-latin);font-size:13px;font-variant-numeric:tabular-nums;direction:ltr;text-align:left}
.toast{text-align:center;font-size:16px;color:var(--gold);min-height:1.4em}
.note{text-align:center;font-size:14px;color:#a79f85}

.enter{animation:rise .5s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
#burst{position:fixed;inset:0;pointer-events:none;z-index:5;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="burst" aria-hidden="true"></canvas>
<div class="wrap" dir="rtl" lang="ar">
  <header>
    <div>
      <div class="org-ar">اللجنة العلمية · اتحاد طلاب صيدلة القاهرة</div>
      <div class="org">FOPCU · SCIENTIFIC COMMITTEE</div>
    </div>
    <button class="sound" id="snd" aria-label="تشغيل الصوت" title="الصوت">🔇</button>
  </header>
  <div class="candles" id="candles" aria-hidden="true"></div>
  <main id="app"></main>
  <p class="note">اختبار للمتعة بس، كل الأقسام هتدرسها وكل واحد فيهم ليه سحره.</p>
</div>

<script>
const H={
 pharma:{emoji:"🦁",name:"Pharma",ar:"الأسد",c:"--pharma",rgb:[220,60,60],
  traits:["شجاع","مبادر","قيادي","بيحب التحدي"],
  blurb:"بتدخل في الصعب من غير تردد، وبتحب تكون أول واحد يبدأ. التحدي بالنسبالك مش عقبة، ده الوقود.",
  about:"عالم الأدوية وتأثيرها على الجسم: الدوا بيشتغل إزاي، وبيوصل لفين، وإيه اللي بيحصل لو الجرعة زادت."},
 phyto:{emoji:"🦅",name:"Phyto",ar:"النسر",c:"--phyto",rgb:[70,190,110],
  traits:["فضولي","ذكي","تحليلي","بيحب يكتشف"],
  blurb:"سؤال «ليه؟» مش بيسيبك. بتحب توصل لأصل الحاجة وتكتشف اللي محدش واخد باله منه.",
  about:"النباتات الطبية والمواد الطبيعية: إزاي نطلّع مادة فعالة من نبات، ونتعرف عليها، ونحوّلها لعلاج."},
 ceutics:{emoji:"🦡",name:"Pharmaceutics",ar:"الغرير",c:"--ceutics",rgb:[240,175,50],
  traits:["صبور","دقيق","مجتهد","خطوة بخطوة"],
  blurb:"إنت اللي الفريق بيعتمد عليه. بتمشي بخطة، ومش بتسيب تفصيلة إلا لما تتأكد إنها مظبوطة.",
  about:"إزاي المادة الفعالة تبقى دوا في إيدك: أقراص، كبسولات، كريمات، شراب… وكل واحدة ليها تركيبة وحسابات دقيقة."},
 medic:{emoji:"🐍",name:"Medicinal",ar:"الثعبان",c:"--medic",rgb:[140,110,230],
  traits:["طموح","استراتيجي","ذكي في قراراته","بيدور على أفضل نتيجة"],
  blurb:"بتشوف الطريق الأذكى قبل ما تتحرك، وعينك دايمًا على أحسن نتيجة ممكنة، مش أي نتيجة.",
  about:"تصميم الدوا من أول جزيء: إزاي نعدّل في تركيب المادة الكيميائية عشان تبقى أقوى وأأمن."}
};
const ORDER=["pharma","phyto","ceutics","medic"];
const Q=[
 {q:"لو واجهت مشكلة صعبة في أول أسبوع ليك في الكلية، هتعمل إيه؟",o:[["أواجهها فورًا وأجرب أحلها بنفسي.","pharma"],["أحاول أفهم سبب المشكلة وأدور وراها.","phyto"],["أقسمها لخطوات صغيرة وأحلها واحدة واحدة.","ceutics"],["أفكر في أكتر طريقة ذكية وأقل مجهود توصلني للحل.","medic"]]},
 {q:"لو عندك امتحان بعد أسبوع، إيه طريقتك؟",o:[["أبدأ بدري وأمشي على خطة ثابتة.","ceutics"],["أركز على الحاجات المهمة اللي هتديني أكبر نتيجة.","medic"],["أذاكر وأفضل أسأل: «ليه؟ وإزاي؟» مش بس أحفظ.","phyto"],["أتحمس للتحدي وأدخل الامتحان وأنا واثق إني هقدر عليه.","pharma"]]},
 {q:"إيه أكتر حاجة بتشدك في تجربة جديدة؟",o:[["إنها فرصة أثبت لنفسي إني أقدر.","pharma"],["إنها فيها حاجة جديدة أقدر أكتشفها.","phyto"],["إنها محتاجة صبر ومهارة عشان أوصل لنتيجة مظبوطة.","ceutics"],["إنها فرصة أتميز وأوصل لنتيجة مش أي حد يقدر يوصلها.","medic"]]},
 {q:"لو اشتغلت في Team Project، غالبًا هتكون…",o:[["الشخص اللي بياخد المبادرة ويبدأ الشغل.","pharma"],["الشخص اللي بيطلع الأفكار ويدور على معلومات جديدة.","phyto"],["الشخص اللي بيتأكد إن كل حاجة اتعملت صح وفي معادها.","ceutics"],["الشخص اللي بيحط الخطة وبيوزع المهام عشان نطلع بأفضل نتيجة.","medic"]]},
 {q:"اختار الجملة الأقرب ليك:",en:true,o:[["Bring on the challenge.","pharma"],["I need to know why.","phyto"],["If it's worth doing, it's worth doing right.","ceutics"],["There is always a smarter way.","medic"]]},
 {q:"لو قدامك 4 طرق مختلفة للنجاح، هتختار…",o:[["الطريق الأصعب، عشان لما أوصل أعرف إني قدرت.","pharma"],["الطريق اللي هتعلم منه أكتر حاجة.","phyto"],["الطريق اللي محتاج شغل وصبر بس نتيجته مضمونة.","ceutics"],["الطريق اللي فيه فرصة أكبر إني أتميز عن الباقيين.","medic"]]},
 {q:"إيه أكتر حاجة ممكن تخليك تستمتع بمادة؟",o:[["إنها مليانة تحديات ومش سهلة.","pharma"],["إنها بتخليني أكتشف حاجات وأفهم أسرار جديدة.","phyto"],["إنها محتاجة دقة وتركيز وتطبيق عملي.","ceutics"],["إنها محتاجة تفكير وتحليل للوصول لأفضل حل.","medic"]]}
];
const KEYS=["أ","ب","ج","د"];
const ROMAN=["I","II","III","IV","V","VI","VII"];

let S=window.claude?.hot?.data?.S||{screen:"intro",i:0,ans:[]};
window.claude?.hot?.snapshot?.(()=>({S}));
const app=document.getElementById("app"),candles=document.getElementById("candles");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ───── sound (WebAudio, starts only after a click) ───── */
let AC=null,soundOn=false;
const sndBtn=document.getElementById("snd");
sndBtn.onclick=()=>{soundOn=!soundOn;sndBtn.textContent=soundOn?"🔊":"🔇";sndBtn.setAttribute("aria-label",soundOn?"إيقاف الصوت":"تشغيل الصوت");if(soundOn){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();chime([784,988]);}catch(e){}}};
function tone(f,t0,d,v=.08,type="sine"){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+d+.05);}
function chime(notes,gap=.09){if(!soundOn||!AC)return;const t=AC.currentTime;notes.forEach((f,k)=>{tone(f,t+k*gap,1.2,.07);tone(f*2,t+k*gap,.8,.02,"triangle");});}
function fanfare(){chime([523,659,784,1047,1319],.12);}

/* ───── night sky: stars, floating candles, gold dust ───── */
const sky=document.getElementById("sky"),sx=sky.getContext("2d");
let W,Hh,DPR,stars=[],cands=[],dust=[];
function size(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;Hh=innerHeight;[sky,burst].forEach(c=>{c.width=W*DPR;c.height=Hh*DPR;c.getContext("2d").setTransform(DPR,0,0,DPR,0,0);});
  stars=Array.from({length:Math.round(W*Hh/5000)},()=>({x:Math.random()*W,y:Math.random()*Hh*.8,r:Math.random()*1.3+.2,p:Math.random()*6.28,s:.5+Math.random()*1.5}));
  cands=Array.from({length:Math.max(7,Math.round(W/70))},()=>({x:Math.random()*W,y:Math.random()*Hh*.75+20,h:14+Math.random()*16,ph:Math.random()*6.28,sp:.3+Math.random()*.5,z:.45+Math.random()*.55}));
  dust=Array.from({length:40},()=>newDust(true));}
function newDust(any){return{x:Math.random()*W,y:any?Math.random()*Hh:Hh+10,v:.15+Math.random()*.35,r:Math.random()*1.6+.4,a:Math.random()*.6+.2,w:Math.random()*6.28};}
function drawSky(t){
  sx.clearRect(0,0,W,Hh);
  for(const s of stars){const a=.35+.65*Math.abs(Math.sin(t*.001*s.s+s.p));sx.fillStyle=`rgba(255,248,220,${a})`;sx.beginPath();sx.arc(s.x,s.y,s.r,0,6.283);sx.fill();}
  for(const c of cands){
    const y=c.y+Math.sin(t*.0006*c.sp*2+c.ph)*10, w=6*c.z, h=c.h*c.z;
    const g=sx.createRadialGradient(c.x,y-h/2-4,0,c.x,y-h/2-4,34*c.z);g.addColorStop(0,"rgba(255,190,90,.35)");g.addColorStop(1,"rgba(255,190,90,0)");
    sx.fillStyle=g;sx.beginPath();sx.arc(c.x,y-h/2-4,34*c.z,0,6.283);sx.fill();
    sx.fillStyle=`rgba(245,236,212,${.55+.4*c.z})`;sx.fillRect(c.x-w/2,y-h/2,w,h);
    const fl=1+Math.sin(t*.012+c.ph)*.12;
    sx.fillStyle="rgba(255,220,130,.95)";sx.beginPath();sx.ellipse(c.x,y-h/2-4*c.z*fl,2.4*c.z,5.5*c.z*fl,0,0,6.283);sx.fill();
    sx.fillStyle="rgba(255,255,235,.95)";sx.beginPath();sx.ellipse(c.x,y-h/2-3*c.z,1*c.z,2.4*c.z,0,0,6.283);sx.fill();
  }
  for(const d of dust){d.y-=d.v;d.x+=Math.sin(t*.001+d.w)*.25;if(d.y<-10)Object.assign(d,newDust(false));
    sx.fillStyle=`rgba(232,196,106,${d.a*(.6+.4*Math.sin(t*.003+d.w))})`;sx.beginPath();sx.arc(d.x,d.y,d.r,0,6.283);sx.fill();}
}

/* ───── bursts ───── */
const burst=document.getElementById("burst"),bx=burst.getContext("2d");let parts=[];
function sparkle(x,y,rgb=[232,196,106],n=26,power=4){if(reduce)return;for(let k=0;k<n;k++){const a=Math.random()*6.283,v=Math.random()*power+1;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:1,r:Math.random()*2.6+1,rgb:Math.random()<.35?[255,240,190]:rgb});}}
function drawBurst(){bx.clearRect(0,0,W,Hh);parts=parts.filter(p=>p.life>0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.life-=.012;
  bx.fillStyle=`rgba(${p.rgb[0]},${p.rgb[1]},${p.rgb[2]},${Math.max(p.life,0)})`;bx.save();bx.translate(p.x,p.y);bx.rotate(p.life*6);
  bx.beginPath();for(let k=0;k<4;k++){bx.lineTo(0,-p.r*2);bx.rotate(Math.PI/4);bx.lineTo(0,-p.r*.6);bx.rotate(Math.PI/4);}bx.fill();bx.restore();}}
function loop(t){drawSky(t);drawBurst();requestAnimationFrame(loop);}
addEventListener("resize",size);size();
if(reduce){drawSky(0);}else requestAnimationFrame(loop);

/* ───── game ───── */
function drawCandles(){
  candles.innerHTML=Q.map((_,k)=>{const lit=S.screen==="result"||(S.ans[k]!=null&&k<S.i);return `<div class="cd ${lit?"lit":""} ${S.screen==="quiz"&&k===S.i?"now":""}"><span class="fl"></span></div>`;}).join("");
  candles.hidden=S.screen==="intro";
}
function scores(){const t={pharma:0,phyto:0,ceutics:0,medic:0};S.ans.forEach((a,k)=>{if(a!=null)t[Q[k].o[a][1]]++;});return t;}
function winner(){const t=scores(),max=Math.max(...Object.values(t)),tied=ORDER.filter(h=>t[h]===max);if(tied.length===1)return tied[0];
  const m=S.ans[4]!=null?Q[4].o[S.ans[4]][1]:null;if(tied.includes(m))return m;
  for(let k=S.ans.length-1;k>=0;k--){const h=Q[k].o[S.ans[k]][1];if(tied.includes(h))return h;}return tied[0];}

function render(){drawCandles();({intro,quiz,think:think,result})[S.screen]();}

function intro(){
  app.innerHTML=`<section class="enter" style="display:flex;flex-direction:column;gap:26px">
    <div class="hero">
      <p class="org" style="text-align:center">✦ THE SORTING OF THE CLASS OF 2032 ✦</p>
      <h1>مراسم اختيار القسم</h1>
      <p class="sub">أربع أقسام، ولكل قسم روح. جاوب ٧ أسئلة بصراحة، والكرة البلورية هتكشفلك إنت تنتمي لأنهي واحد.</p>
    </div>
    <div class="pennants">${ORDER.map(h=>`<div class="pen" style="--c:var(${H[h].c})"><div class="rod"></div><div class="flag"><span class="an">${H[h].emoji}</span><span class="nm">${H[h].name.toUpperCase()}</span></div></div>`).join("")}</div>
    <div class="center"><button class="btn" id="go">ابدأ المراسم ✦</button></div>
  </section>`;
  document.getElementById("go").onclick=e=>{const r=e.target.getBoundingClientRect();sparkle(r.left+r.width/2,r.top+r.height/2,undefined,40,5);chime([659,784,988]);S={screen:"quiz",i:0,ans:[]};setTimeout(render,250);};
}

function quiz(){
  const q=Q[S.i],cur=S.ans[S.i];
  app.innerHTML=`<section class="parch enter" aria-live="polite">
    <p class="flour">— QUESTIO ${ROMAN[S.i]} —</p>
    <h2>${esc(q.q)}</h2>
    <div class="rule"></div>
    <div class="opts" role="radiogroup">${q.o.map((o,k)=>`<button class="opt ${cur===k?"picked":""}" role="radio" aria-checked="${cur===k}" data-k="${k}"><span class="key">${KEYS[k]}</span><span ${q.en?'lang="en"':''}>${esc(q.en?`“${o[0]}”`:o[0])}</span></button>`).join("")}</div>
    <div class="row"><button class="btn ink" id="back" ${S.i===0?"disabled":""}>السابق</button><span class="qn">${S.i+1} / ${Q.length}</span></div>
  </section>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    S.ans[S.i]=+b.dataset.k;
    app.querySelectorAll(".opt").forEach(x=>{x.classList.toggle("picked",x===b);x.setAttribute("aria-checked",x===b);});
    const r=b.getBoundingClientRect();sparkle(r.left+r.width*.85,r.top+r.height/2,undefined,18,3);chime([880+S.i*60]);
    setTimeout(()=>{if(S.i<Q.length-1){S.i++;}else{S.screen="think";}render();window.scrollTo({top:0,behavior:"smooth"});},420);
  });
  document.getElementById("back").onclick=()=>{if(S.i>0){S.i--;render();}};
}

function think(){
  app.innerHTML=`<section class="orb-wrap enter"><div class="orb"></div><p class="orb-text" id="ot"></p></section>`;
  const lines=["همم… صعب…","شايف شجاعة… وفضول… ودقة…","بس فيه حاجة غالبة عليك…","خلاص… عرفت!"];
  const ot=document.getElementById("ot");let k=0;const step=()=>{ot.textContent=lines[k];chime([440+k*110],0);k++;if(k<lines.length)setTimeout(step,reduce?250:850);else setTimeout(()=>{S.screen="result";render();},reduce?300:900);};step();
}

function result(){
  const w=winner(),h=H[w],t=scores(),n=Q.length;
  app.innerHTML=`<section class="parch decree enter" style="--c:var(${h.c})">
    <p class="flour">— DECREE OF THE COMMITTEE —</p>
    <div class="seal" id="seal" aria-hidden="true">${h.emoji}</div>
    <p class="lede">إنت من بيت ${h.ar}</p>
    <h1>${h.name}</h1>
    <ul class="traits">${h.traits.map(x=>`<li>${x}</li>`).join("")}</ul>
    <p class="blurb">${h.blurb}</p>
    <div class="study"><b>القسم ده بيدرس إيه؟</b><p>${h.about}</p></div>
    <div class="study"><b>ميزان إجاباتك</b>
      <div class="bars">${ORDER.map(k=>`<div class="bar" style="--c:var(${H[k].c})"><span class="lab">${H[k].emoji} ${H[k].name}</span><div class="track"><div class="fill" data-w="${Math.round(t[k]/n*100)}"></div></div><span class="pct">${Math.round(t[k]/n*100)}%</span></div>`).join("")}</div>
    </div>
  </section>
  <div class="center"><button class="btn ghost" id="again">أعيد المراسم</button><button class="btn" id="share">انسخ نتيجتي ✦</button></div>
  <p class="toast" id="toast" role="status"></p>`;
  setTimeout(()=>{const s=document.getElementById("seal");if(!s)return;const r=s.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;
    sparkle(cx,cy,h.rgb,70,7);setTimeout(()=>sparkle(cx,cy,[232,196,106],40,5),250);fanfare();
    app.querySelectorAll(".fill").forEach(f=>f.style.width=f.dataset.w+"%");},650);
  document.getElementById("again").onclick=()=>{S={screen:"intro",i:0,ans:[]};render();window.scrollTo({top:0});};
  document.getElementById("share").onclick=async e=>{const r=e.target.getBoundingClientRect();sparkle(r.left+r.width/2,r.top,h.rgb,24,4);
    const txt=`${h.emoji} الكرة البلورية قالت إني من بيت ${h.ar} — ${h.name}! (${h.traits.join("، ")}) في مراسم اختيار القسم من اللجنة العلمية. وإنت طلعت إيه؟`;
    const toast=document.getElementById("toast");try{await navigator.clipboard.writeText(txt);toast.textContent="اتنسخت ✦ الزقها في الجروب أو الستوري";}catch{toast.textContent=txt;}};
}

function start(){render();}
window.claude?.hot?.ready?window.claude.hot.ready(start):start();
</script>
</body>
</html>
